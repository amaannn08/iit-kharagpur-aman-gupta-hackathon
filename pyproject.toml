[project]
name = "sentinel"
version = "0.1.0"
description = "S&P Sentinel: Offline financial risk intelligence and wholesale stress testing"
readme = "README.md"
authors = [
    { name = "Aman Gupta", email = "amangupta08@kgpian.iitkgp.ac.in" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "networkx>=3.3",
    "python-multipart>=0.0.9",
    "scikit-learn>=1.5.0",
    "joblib>=1.3.0",
    "datasketch>=1.6.5",
]

[project.optional-dependencies]
nlp = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[dependency-groups]
# Build-time dataset acquisition only (scripts/data/fetch_real.py); never imported at runtime.
data = [
    "kagglehub>=0.3.12",
    "huggingface-hub>=0.34.0",
    "yfinance>=0.2.65",
    "lxml>=5.4.0",
    "pyarrow>=20.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pillow>=12.3.0",
    "matplotlib>=3.11.2",
    "reportlab>=5.0.1",
]

# CPU-only PyTorch for the optional `nlp` extra (the default index pulls the ~5.7 GB CUDA build).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
